/* Fixed palette (Maxwell t102u + QM): royal blue main, black secondary, white text and lines. No yellow except emojis. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: #1D4ED8; }
body {
  margin: 0; background: #1D4ED8; color: #FFFFFF;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", "Leelawadee UI", sans-serif;
  min-height: 100vh;
  padding: 18px 14px 28px;
  padding-top: calc(18px + env(safe-area-inset-top));
  padding-right: calc(14px + env(safe-area-inset-right));
  padding-bottom: calc(28px + env(safe-area-inset-bottom));
  padding-left: calc(14px + env(safe-area-inset-left));
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 640px; margin: 0 auto; }
/* Vertical spacing with margins, not flex gap (Safari 14 safe). */
.stack > * + * { margin-top: 14px; }
.opts > * + * { margin-top: 12px; }
.title { font-size: 28px; line-height: 1.3; font-weight: 700; }
.lead { font-size: 20px; line-height: 1.5; }
.big { font-size: 22px; line-height: 1.5; }
.small { font-size: 16px; line-height: 1.5; }
.thai {
  background: #0B0B12; color: #FFFFFF; border-left: 4px solid #FFFFFF; border-radius: 10px;
  padding: 10px 14px; font-size: 18px; line-height: 1.7;
}
.q { font-size: 24px; line-height: 38px; white-space: pre-line; overflow-wrap: break-word; word-wrap: break-word; }
.blank {
  display: inline-block; height: 1em; border-bottom: 3px solid #FFFFFF; margin: 0 0.15em; vertical-align: baseline;
}
button {
  -webkit-appearance: none; appearance: none;
  touch-action: manipulation;
  font-family: inherit; cursor: pointer; margin: 0;
  -webkit-user-select: none; user-select: none;
}
.btn {
  display: block; width: 100%; box-sizing: border-box; min-height: 56px;
  padding: 16px 18px; font-size: 20px; line-height: 1.4; border-radius: 14px;
  border: 2px solid #FFFFFF; background: #0B0B12; color: #FFFFFF; text-align: left;
  white-space: normal; overflow-wrap: break-word; word-wrap: break-word;
}
.btn.main { text-align: center; background: #FFFFFF; color: #0B0B12; font-weight: 700; }
.btn.right { background: #FFFFFF; color: #1D4ED8; border: 3px solid #FFFFFF; font-weight: 700; }
.btn.miss { border: 2px dashed #B4B8C5; text-decoration: line-through; color: #FFFFFF; }
.pill {
  min-height: 44px; min-width: 44px; padding: 8px 14px; font-size: 16px; line-height: 1.4;
  border-radius: 999px; border: 2px solid #FFFFFF; background: #0B0B12; color: #FFFFFF;
}
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.bar > * { margin-top: 4px; margin-bottom: 4px; }
.bar .pill + .pill { margin-left: 8px; }
.feedback { font-size: 19px; line-height: 1.7; }
.yes { font-size: 20px; line-height: 1.7; }
.nowrap { white-space: nowrap; }
.footer { margin-top: 26px; padding-top: 14px; border-top: 1px solid #FFFFFF; font-size: 17px; line-height: 1.7; }
.footer div { padding-top: 6px; }
</style>

":["Does he likes it?","Does he like it?","He like does it?"],"answer":1,"answer_text":"Does he like it?","th":"เขาชอบไหม: หลัง Does ใช้ like ไม่มี s","th_status":"NEEDS NANCY","tip":"Does he like it? (no s after does)"},{"n":76,"round":4,"technique":"who","q":"📞 Maxwell is at work.\nNancy says, \"I will tell him.\"\nWho is \"him\"?","options":["Maxwell","Nancy","the cat"],"answer":0,"answer_text":"Maxwell","th":"him หมายถึงผู้ชายคนไหน","th_status":"NEEDS NANCY","tip":"him = Maxwell 👨"},{"n":77,"round":4,"technique":"sound","q":"6️⃣ Which word ends with 'ks', like x?","options":["sit","six","sick"],"answer":1,"answer_text":"six","th":"เสียงท้ายมีทั้ง ก และ ส","th_status":"NEEDS NANCY","tip":"six = SIKS"},{"n":78,"round":4,"technique":"order","q":"🚗 Which sentence is right about driving?","options":["Maxwell drives the car.","Maxwell the car drives.","Drives the car Maxwell."],"answer":0,"answer_text":"Maxwell drives the car.","th":"แม็กซ์เวลล์ขับรถ","th_status":"NEEDS NANCY","tip":"Maxwell drives the car."},{"n":79,"round":4,"technique":"faith","q":"👶🙏 Let's pray for the [blank].","options":["bus","bowl","baby"],"answer":2,"answer_text":"baby","th":"มาอธิษฐานเผื่อลูกกันนะ","th_status":"NEEDS NANCY","tip":"Let's pray for the baby. 🙏","blank":4},{"n":80,"round":4,"technique":"story","q":"📖 The baby is coming in December.\nNancy and Maxwell are excited.\nWhen is the baby coming?","options":["in June","on Monday","in December"],"answer":2,"answer_text":"in December","th":"ลูกจะมาเดือนไหน","th_status":"NEEDS NANCY","tip":"in December 👶🎄"},{"n":81,"round":5,"technique":"picture","q":"👩😴 How does she feel?","options":["sleepy","hungry","angry"],"answer":0,"answer_text":"sleepy","th":"ดูหน้าเธอสิ อยากนอนแล้ว","th_status":"NEEDS NANCY","tip":"She is sleepy. 😴"},{"n":82,"round":5,"technique":"pronoun","q":"👨🧢 Maxwell has a hat. The hat is [blank].","options":["him","he","his"],"answer":2,"answer_text":"his","th":"หมวกเป็นของแม็กซ์เวลล์","th_status":"NEEDS NANCY","tip":"The hat is his. 🧢","blank":3},{"n":83,"round":5,"technique":"order","q":"🛏️ Tap the right bedtime sentence.","options":["I go to bed at ten.","I to bed go at ten.","At ten bed I go to."],"answer":0,"answer_text":"I go to bed at ten.","th":"ฉันเข้านอนตอนสี่ทุ่ม","th_status":"NEEDS NANCY","tip":"I go to bed at ten."},{"n":84,"round":5,"technique":"who","q":"🏠 Maxwell and Nancy say, \"This is our home.\"\nWhose home is it?","options":["the doctor's","Maxwell and Nancy's","the store's"],"answer":1,"answer_text":"Maxwell and Nancy's","th":"บ้านนี้เป็นของใคร","th_status":"NEEDS NANCY","tip":"our home = Maxwell and Nancy's 🏠"},{"n":85,"round":5,"technique":"noun","q":"🍳 Put the pan in the [blank].","options":["kitchen sink","sink kitchen","sink of kitchen"],"answer":0,"answer_text":"kitchen sink","th":"อ่างล้างจานในครัว: อ่างอยู่คำสุดท้าย","th_status":"NEEDS NANCY","tip":"kitchen sink: it is a sink.","blank":11},{"n":86,"round":5,"technique":"sound","q":"🥪 Which word ends with 'ch' (choo)?","options":["lung","luck","lunch"],"answer":2,"answer_text":"lunch","th":"เสียงท้ายเหมือน ช","th_status":"NEEDS NANCY","tip":"lunch ends with CH."},{"n":87,"round":5,"technique":"adjective","q":"😊 Maxwell is a [blank].","options":["good man","man good","good of man"],"answer":0,"answer_text":"good man","th":"ผู้ชายที่ดี: ดีมาก่อนผู้ชาย","th_status":"NEEDS NANCY","tip":"a good man 😊","blank":7},{"n":88,"round":5,"technique":"story","q":"📖 Nancy calls her mom in Thailand.\nHer mom is happy.\nWho does Nancy call?","options":["her mom","her doctor","Maxwell"],"answer":0,"answer_text":"her mom","th":"แนนซี่โทรหาใคร","th_status":"NEEDS NANCY","tip":"She calls her mom. 📞"},{"n":89,"round":5,"technique":"question","q":"📞 Ask if the doctor called.","options":["Did call the doctor?","Did the doctor call?","The doctor call did?"],"answer":1,"answer_text":"Did the doctor call?","th":"หมอโทรมาหรือยัง: ขึ้นต้นด้วย Did","th_status":"NEEDS NANCY","tip":"Did the doctor call?"},{"n":90,"round":5,"technique":"faith","q":"✝️ Jesus is [blank] friend.","options":["me","mine","my"],"answer":2,"answer_text":"my","th":"พระเยซูเป็นเพื่อนของฉัน","th_status":"NEEDS NANCY","tip":"my friend (my + a thing or person)","blank":2},{"n":91,"round":5,"technique":"pronoun","q":"👩📱 Nancy has a phone. The phone is [blank].","options":["her","hers","she"],"answer":1,"answer_text":"hers","th":"โทรศัพท์เป็นของแนนซี่ ไม่มีคำนามตามหลัง","th_status":"NEEDS NANCY","tip":"The phone is hers. (HURZ)","blank":4},{"n":92,"round":5,"technique":"noun","q":"🎂 Nancy makes a [blank].","options":["cake birthday","cake of birthday","birthday cake"],"answer":2,"answer_text":"birthday cake","th":"เค้กวันเกิด: เค้กอยู่คำสุดท้าย","th_status":"NEEDS NANCY","tip":"birthday cake: it is a cake. 🎂","blank":12},{"n":93,"round":5,"technique":"picture","q":"🎂🎉 Today is my [blank]!","options":["doctor","birthday","kitchen"],"answer":1,"answer_text":"birthday","th":"มีเค้กและงานฉลองนะ","th_status":"NEEDS NANCY","tip":"my birthday 🎂","blank":8},{"n":94,"round":5,"technique":"adjective","q":"🛏️ The baby has a [blank].","options":["soft blanket","blanket soft","soft of blanket"],"answer":0,"answer_text":"soft blanket","th":"ผ้าห่มนุ่ม ๆ: นุ่มมาก่อน","th_status":"NEEDS NANCY","tip":"a soft blanket","blank":11},{"n":95,"round":5,"technique":"question","q":"⛪ Ask Maxwell about church on Sunday.","options":["Are we going to church?","Going we are to church?","We going are to church?"],"answer":0,"answer_text":"Are we going to church?","th":"วันอาทิตย์เราจะไปโบสถ์กันไหม","th_status":"NEEDS NANCY","tip":"Are we going ...?"},{"n":96,"round":5,"technique":"who","q":"🩺 The doctor is a man.\nNancy says, \"I like him.\"\nWho does Nancy like?","options":["her mom","the cat","the doctor"],"answer":2,"answer_text":"the doctor","th":"หมอเป็นผู้ชาย him คือใคร","th_status":"NEEDS NANCY","tip":"him = the doctor 🩺"},{"n":97,"round":5,"technique":"sound","q":"🎄 In 'December', which part is strong?","options":["DE-cem-ber","de-cem-BER","de-CEM-ber"],"answer":2,"answer_text":"de-CEM-ber","th":"พูดช้า ๆ แล้วลองดูว่าพยางค์ไหนดังที่สุด","th_status":"NEEDS NANCY","tip":"de-CEM-ber: the middle is strong. The baby comes in December! 👶"},{"n":98,"round":5,"technique":"order","q":"☕ Pick the right sentence for the morning.","options":["I coffee drink in the morning.","I drink coffee in the morning.","Drink I coffee in the morning."],"answer":1,"answer_text":"I drink coffee in the morning.","th":"ฉันดื่มกาแฟตอนเช้า","th_status":"NEEDS NANCY","tip":"Who + do + what + when"},{"n":99,"round":5,"technique":"faith","q":"🙏 Ask Maxwell to pray with you.","options":["We pray can together?","Pray we can together?","Can we pray together?"],"answer":2,"answer_text":"Can we pray together?","th":"เราอธิษฐานด้วยกันได้ไหม","th_status":"NEEDS NANCY","tip":"Can we pray together?"},{"n":100,"round":5,"technique":"story","q":"📖 On Sunday, Maxwell and Nancy go to church.\nThey sing and pray.\nWhere do they go on Sunday?","options":["to the store","to church","to work"],"answer":1,"answer_text":"to church","th":"วันอาทิตย์พวกเขาไปที่ไหน","th_status":"NEEDS NANCY","tip":"They go to church. ⛪"}]</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("quiz-data").textContent);
  var ROUND_SIZE = 20, ROUNDS = 5, KEY = "nancyEnglishQuiz.v1";
  var LABEL = {
    picture: "🖼️ Picture clue", pronoun: "👤 Pick the word", order: "🧱 Word order", noun: "🔗 Two nouns",
    adjective: "🎨 Describe it", question: "❓ Ask it", sound: "👄 Sound tip", story: "📖 Tiny story",
    who: "🏠 Who is it?", faith: "🙏 Faith"
  };

  function fresh() {
    return { screen: "start", round: 0, i: 0, picked: null, missed: [], score: 0, best: [-1, -1, -1, -1, -1] };
  }
  var S = fresh();

  // localStorage can throw in Private mode or when full: never let that break the game.
  function load() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return;
      var v = JSON.parse(raw);
      if (!v || typeof v !== "object") return;
      var s = fresh();
      if (v.screen === "start" || v.screen === "play" || v.screen === "end") s.screen = v.screen;
      if (v.round >= 0 && v.round < ROUNDS) s.round = v.round | 0;
      if (v.i >= 0 && v.i < ROUND_SIZE) s.i = v.i | 0;
      if (v.picked === null || (typeof v.picked === "number" && v.picked % 1 === 0 && v.picked >= 0 && v.picked <= 2)) s.picked = v.picked;
      if (Object.prototype.toString.call(v.missed) === "[object Array]") { s.missed = []; for (var mi = 0; mi < v.missed.length && mi < 3; mi++) { var mv = v.missed[mi]; if ((typeof mv === "number" && mv % 1 === 0 && mv >= 0 && mv <= 2) && s.missed.indexOf(mv) < 0) s.missed.push(mv); } }
      if (v.score >= 0 && v.score <= ROUND_SIZE) s.score = v.score | 0;
      if (Object.prototype.toString.call(v.best) === "[object Array]" && v.best.length === ROUNDS) { for (var bi = 0; bi < ROUNDS; bi++) { var bv = v.best[bi]; s.best[bi] = (typeof bv === "number" && bv % 1 === 0 && bv >= -1 && bv <= 20) ? bv : -1; } }
      S = s;
    } catch (e) { /* ignore */ }
  }
  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function btn(cls, text, fn) {
    var b = el("button", cls, text);
    b.type = "button";
    b.addEventListener("click", fn);
    return b;
  }

  function startRound(r) {
    S.screen = "play"; S.round = r; S.i = 0; S.picked = null; S.missed = []; S.score = 0;
    save(); render(true);
  }
  function startOver() {
    var ok = true;
    try { ok = window.confirm("Start over? All round scores will be cleared.\nเริ่มใหม่ไหม คะแนนทุกรอบจะหายนะ"); } catch (e) { ok = false; }
    if (!ok) return;
    S = fresh(); save(); render(true);
  }
  function toStart() { S.screen = "start"; save(); render(true); }
  function pick(k) {
    var cur = DATA[S.round * ROUND_SIZE + S.i];
    if (S.picked !== null && S.picked === cur.answer) return;
    S.picked = k;
    if (k === cur.answer) {
      if (S.missed.length === 0) S.score += 1;
    } else if (S.missed.indexOf(k) < 0) {
      S.missed.push(k);
    }
    save(); render(false);
  }
  function next() {
    if (S.i + 1 >= ROUND_SIZE) {
      S.best[S.round] = Math.max(S.best[S.round], S.score);
      S.screen = "end";
    } else {
      S.i += 1; S.picked = null; S.missed = [];
    }
    save(); render(true);
  }

  function renderQ(item, box) {
    var parts = item.q.split("[blank]");
    for (var idx = 0; idx < parts.length; idx++) {
      if (idx > 0) {
        var b = el("span", "blank");
        b.setAttribute("aria-label", "blank");
        b.style.width = (item.blank || 3) + "ch";
        box.appendChild(b);
      }
      box.appendChild(document.createTextNode(parts[idx]));
    }
  }

  function render(scrollTop) {
    var app = document.getElementById("app");
    while (app.firstChild) app.removeChild(app.firstChild);
    var body = el("div", "stack");
    if (S.screen === "start") {
      body.appendChild(el("div", "title", "Nancy's English Quiz 💙"));
      body.appendChild(el("div", "lead", "100 little questions in 5 rounds. Pick a round. Stop any time and come back later!"));
      body.appendChild(el("div", "thai", "เลือกรอบที่อยากเล่น รอบละ 20 ข้อ เล่นสบาย ๆ นะ"));
      for (var r = 0; r < ROUNDS; r++) {
        (function (r) {
          var t = "Round " + (r + 1) + " · Questions " + (r * ROUND_SIZE + 1) + "–" + ((r + 1) * ROUND_SIZE) +
            (S.best[r] >= 0 ? "  ✓ " + S.best[r] + " / " + ROUND_SIZE : "");
          body.appendChild(btn("btn", t, function () { startRound(r); }));
        })(r);
      }
      var row = el("div");
      row.appendChild(btn("pill", "Start over ⟲", startOver));
      body.appendChild(row);
    } else if (S.screen === "end") {
      var sc = S.score;
      var msg = sc >= 17 ? "Wow, Nancy! Amazing! 🌟" : sc >= 12 ? "Great job, Nancy! 😊" : "Good try, Nancy! Every round helps 💙";
      body.appendChild(el("div", "title", "Round " + (S.round + 1) + " done! 🎉"));
      body.appendChild(el("div", "big", msg));
      body.appendChild(el("div", "big", "You got " + sc + " out of " + ROUND_SIZE + " on the first try."));
      body.appendChild(el("div", "thai", "เก่งมากเลย! เล่นทุกวันจะเก่งขึ้นเรื่อย ๆ นะ"));
      if (S.round + 1 < ROUNDS) body.appendChild(btn("btn main", "Next round ➜", function () { startRound(S.round + 1); }));
      body.appendChild(btn("btn", "Play this round again 🔁", function () { startRound(S.round); }));
      body.appendChild(btn("btn", "All rounds 🏠", toStart));
    } else {
      var n = S.round * ROUND_SIZE + S.i;
      var cur = DATA[n];
      var right = S.picked !== null && S.picked === cur.answer;
      var wrong = S.picked !== null && S.picked !== cur.answer;
      var bar = el("div", "bar");
      bar.appendChild(el("div", "small", "Round " + (S.round + 1) + " · Question " + (n + 1) + " of " + DATA.length + " · Score " + S.score));
      var pills = el("div");
      pills.appendChild(btn("pill", "Rounds", toStart));
      pills.appendChild(btn("pill", "Start over", startOver));
      bar.appendChild(pills);
      body.appendChild(bar);
      body.appendChild(el("div", "small", LABEL[cur.technique] || ""));
      var q = el("div", "q"); renderQ(cur, q); body.appendChild(q);
      body.appendChild(el("div", "thai", cur.th));
      var opts = el("div", "opts");
      for (var k = 0; k < cur.options.length; k++) {
        (function (k) {
          var isRight = S.picked === k && k === cur.answer;
          var isMissed = S.missed.indexOf(k) >= 0;
          var cls = isRight ? "btn right" : isMissed ? "btn miss" : "btn";
          var t = (isMissed ? "✗ " : "") + cur.options[k] + (isRight ? "  ✓" : "");
          opts.appendChild(btn(cls, t, function () { pick(k); }));
        })(k);
      }
      body.appendChild(opts);
      if (wrong) {
        var f = el("div", "feedback", "Almost! Try another one 😊 ");
        f.appendChild(el("span", "nowrap", "เกือบแล้ว ลองอีกทีนะ"));
        body.appendChild(f);
      }
      if (right) {
        body.appendChild(el("div", "yes", "Yes! " + cur.tip + " เก่งมาก!"));
        body.appendChild(btn("btn main", S.i + 1 >= ROUND_SIZE ? "See my score 🎉" : "Next ➜", next));
      }
    }
    app.appendChild(body);
    if (scrollTop) { try { window.scrollTo(0, 0); } catch (e) {} }
  }

  load();
  render(true);
})();
</script>
