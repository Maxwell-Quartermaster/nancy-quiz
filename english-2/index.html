<title>Nancy's English 2</title>
<style>
/* Instructor: v2.1 starts from the v1 100-question quiz (webapp/index.html 67a27e99): same screens, layout and flow.
   Changes: green/pink colors (t120u), raised buttons (t919u), 200 items as 10 rounds of 20, listen/recall/say cards, ESV verse card.
   Scroll (t925u): body has no viewport-height rule, no fixed/overflow wrappers, no touch handlers; the page scrolls like a normal page. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: #14532D; }
body {
  margin: 0; background: #14532D; color: #FFFFFF;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", "Leelawadee UI", sans-serif;
  padding: 10px 12px 20px;
  padding-top: calc(10px + env(safe-area-inset-top));
  padding-right: calc(12px + env(safe-area-inset-right));
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
  padding-left: calc(12px + env(safe-area-inset-left));
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 640px; margin: 0 auto; }
/* Vertical spacing with margins, not flex gap (Safari 14 safe). */
.stack > * + * { margin-top: 10px; }
.opts > * + * { margin-top: 8px; }
.title { font-size: 28px; line-height: 1.3; font-weight: 700; }
.head { font-size: 22px; line-height: 1.4; font-weight: 700; color: #F9A8D4; margin-top: 22px; }
.lead { font-size: 20px; line-height: 1.5; }
.big { font-size: 22px; line-height: 1.5; }
.small { font-size: 18px; line-height: 1.5; }
.thai { color: #FFFFFF; border-left: 4px solid #F9A8D4; padding: 2px 12px; font-size: 19px; line-height: 1.6; }
.cue { font-size: 26px; line-height: 1.6; font-weight: 700; border-left: 4px solid #F9A8D4; padding: 4px 12px; }
.q { font-size: 23px; line-height: 32px; white-space: pre-line; overflow-wrap: break-word; word-wrap: break-word; }
.line { font-size: 28px; line-height: 1.45; font-weight: 700; }
.blank { display: inline-block; width: 3ch; height: 1em; border-bottom: 3px solid #F9A8D4; margin: 0 0.15em; vertical-align: baseline; }
button {
  -webkit-appearance: none; appearance: none;
  touch-action: manipulation;
  font-family: inherit; cursor: pointer; margin: 0;
  -webkit-user-select: none; user-select: none;
}
.btn {
  display: block; width: 100%; box-sizing: border-box; min-height: 56px;
  padding: 12px 16px; font-size: 20px; line-height: 1.3; border-radius: 14px;
  border: 2px solid #FFFFFF; background: #0F3D22; color: #FFFFFF; text-align: left;
  white-space: normal; overflow-wrap: break-word; word-wrap: break-word;
  box-shadow: 0 4px 0 #05170C; margin-bottom: 4px;
}
.btn.main { text-align: center; background: #F9A8D4; color: #14532D; font-weight: 700; box-shadow: 0 4px 0 #9D2A63; }
.btn.right { background: #FFFFFF; color: #14532D; border: 3px solid #FB7185; font-weight: 700; }
.btn.miss { border: 2px dashed #B4B8C5; text-decoration: line-through; color: #D1D5DB; box-shadow: none; }
.pill {
  min-height: 56px; min-width: 56px; padding: 8px 16px; font-size: 18px; line-height: 1.4;
  border-radius: 999px; border: 2px solid #FFFFFF; background: #0F3D22; color: #FFFFFF;
  box-shadow: 0 4px 0 #05170C; margin-bottom: 4px;
}
.bar { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; }
.bar > * { margin-top: 4px; margin-bottom: 4px; }
.pill + .pill { margin-left: 8px; }
.qrow { display: -webkit-flex; display: flex; -webkit-align-items: flex-start; align-items: flex-start; }
.qrow > .grow { -webkit-flex: 1 1 auto; flex: 1 1 auto; min-width: 0; }
.qrow > .side { -webkit-flex: 0 0 auto; flex: 0 0 auto; margin-left: 10px; text-align: right; }
.side .pill { display: block; margin-left: 0; }
.side .pill + .pill { margin-left: 0; margin-top: 8px; }
.pill.icon { padding: 8px 10px; }
.feedback { font-size: 19px; line-height: 1.5; }
.yes { font-size: 20px; line-height: 1.5; }
.nowrap { white-space: nowrap; }
.verse { border: 3px solid #FACC15; border-radius: 18px; padding: 20px 16px; color: #FACC15; }
.verse .v { font-size: 24px; line-height: 1.5; font-weight: 700; }
.verse .ref, .verse .pth { font-size: 19px; line-height: 1.6; color: #FDE68A; margin-top: 8px; }
.verse .ph { font-size: 21px; line-height: 1.5; margin-top: 16px; padding-top: 12px; border-top: 1px solid #FACC15; }
.notice { font-size: 18px; line-height: 1.6; }
.footer { margin-top: 26px; padding-top: 14px; border-top: 1px solid #FFFFFF; font-size: 18px; line-height: 1.7; max-width: 640px; margin-left: auto; margin-right: auto; }
.footer div { padding-top: 6px; }
</style>
</head>

  var NOVELTY_URI = CFG.voice_exclude_uri_prefix || "com.apple.speech.synthesis.voice.";
  var REPLAY = CFG.voice_replay || [["Daniel", "en-GB"], ["Karen", "en-AU"]], NEVER_TH = CFG.voice_never_th || ["en-IE", "en-IN"];
  var EXCLUDE_URI = /eloquence/i;

  function speak(list, who, thSafe, noCancel) {

  function sayTarget(it, slow, noCancel) {

  }

  /* ---------- game (v1 flow) ---------- */
  function cur() { return DATA[S.round * ROUND_SIZE + S.q[S.i]]; }
  function startRound(r) {

  /* level name + part, e.g. "First steps · Part 2" (emoji dropped to keep it short) */

  function nextUnfinished() { for (var r = 0; r < ROUNDS; r++) if (S.best[r] < 0) return r; return 0; }

    S = fresh(); save(); render(true);
  }
  function toStart() { try { var s = synth(); if (s && (s.speaking || s.pending)) s.cancel(); } catch (e) {} S.screen = "start"; save(); render(true); }
  function firstPass() { return S.i < ROUND_SIZE; }
  function pick(k) {
    var it = cur();
    if (S.picked !== null && S.picked === it.answer) return;
    S.picked = k;
    if (k === it.answer) {
      if (S.missed.length === 0 && firstPass()) S.score += 1;
      sayText(it.en);
    } else if (S.missed.indexOf(k) < 0) {
      S.missed.push(k);
      if (firstPass() && S.wrong.indexOf(S.q[S.i]) < 0) { S.wrong.push(S.q[S.i]); S.q.push(S.q[S.i]); } /* missed: comes back once at the end */
    }
    save(); render(false);
  }
  function said() {
    S.picked = 0;
    if (firstPass()) S.score += 1;
    save(); render(false);
  }
  function showChoices() { S.shown = true; save(); render(false); }
  function next() {
    if (S.i + 1 >= S.q.length) {
      S.best[S.round] = Math.max(S.best[S.round], S.score);
      S.screen = "end";
      save(); render(true);
      return;
    }
    S.i += 1; S.picked = null; S.missed = []; S.shown = false;

  }

  function renderQ(item, box) {

      box.appendChild(document.createTextNode(parts[idx]));

  }
  function verseCard(body) {

    c.appendChild(el("div", "v", v.en));
    c.appendChild(el("div", "ref", v.ref + " (ESV)"));
    if (SHOW_THAI_BIBLE && v.th) c.appendChild(el("div", "pth", v.th));
    c.appendChild(el("div", "ph", "Phrase of the day: " + p.en));
    c.appendChild(el("div", "pth", p.th));

          })(L * 2 + part);

      }

      row.appendChild(btn("pill", "Start over ⟲", startOver));
      body.appendChild(row);
    } else if (S.screen === "end") {
      body.id = "end";
      var sc = S.score;
      var msg = sc >= 17 ? "Wow, Nancy! Amazing! 🌟" : sc >= 12 ? "Great job, Nancy! 😊" : "Good try, Nancy! Every round helps 💚";
      body.appendChild(el("div", "title", partName(S.round) + " done! 🎉"));
      body.appendChild(el("div", "big", msg));
      body.appendChild(el("div", "big", "You got " + sc + " out of " + ROUND_SIZE + " on the first try."));
      if (S.wrong.length) {
        body.appendChild(el("div", "lead", "Words to practice:"));
        var ml = el("div", "opts"); ml.id = "missed";
        S.wrong.forEach(function (k) { var it = DATA[S.round * ROUND_SIZE + k]; var w = el("div", "thai"); w.appendChild(el("div", "big", it.en)); w.appendChild(el("div", "", it.th)); ml.appendChild(w); });
        body.appendChild(ml);

      var ab = btn("btn", "Play this round again 🔁", function () { startRound(S.round); }); ab.id = "again-round"; body.appendChild(ab);
      var hb = btn("btn", "All rounds 🏠", toStart); hb.id = "all-rounds"; body.appendChild(hb);
      verseCard(body);
    } else {
      var it = cur();
      body.id = "card"; body.setAttribute("data-id", it.id); body.setAttribute("data-type", it.type);
      var done = S.picked !== null && (it.type === "say" || S.picked === it.answer);
      var wrong = S.picked !== null && !done;
      var bar = el("div", "bar");
      bar.appendChild(el("div", "small", partName(S.round) + " · " + (S.i + 1) + "/" + S.q.length + " · Score " + S.score));
      bar.appendChild(btn("pill", "Rounds", toStart));
      body.appendChild(bar);
      if (!firstPass()) body.appendChild(el("div", "thai", UI("again_note")));
      var hasVoice = !!synth();
      /* question text with its 🔊 (and 🐢) on the right, so the card fits a small phone without scrolling */
      function qRow(node, pills) { var r = el("div", "qrow"); node.className += " grow"; r.appendChild(node); var c = el("div", "side"); pills.forEach(function (p) { c.appendChild(p); }); r.appendChild(c); body.appendChild(r); }
      function hear(fn, id, label) { var b = btn("pill icon", label || "🔊", fn); b.id = id || "hear"; b.setAttribute("aria-label", id === "slow" ? "Slow" : "Hear it"); return b; }
      if (it.type === "listen") {
        qRow(el("div", "q", it.q), [hear(function () { sayTarget(it, false); }), hear(function () { sayTarget(it, true); }, "slow", "🐢 Slow")]);
        if (!hasVoice) body.appendChild(el("div", "big", it.say));
      } else if (it.type === "recall") {
        if (it.cue_audio) {
          qRow(el("div", "q", it.q), [hear(function () { sayText(it.cue_audio); })]);
          if (!hasVoice) body.appendChild(el("div", "big", it.cue_audio));
        } else body.appendChild(el("div", "q", it.q));
        if (it.cue_th) body.appendChild(el("div", "cue", it.cue_th));
      } else if (it.type === "say") {
        body.appendChild(el("div", "q", it.q));
        qRow(el("div", "line", it.en), [hear(function () { sayText(it.en); })]);
        body.appendChild(el("div", "thai", it.th));
        body.appendChild(el("div", "small", "💡 " + it.tip));
      } else {
        var q = el("div", "q"); renderQ(it, q);
        if (/[A-Za-z]{2}/.test(it.q.replace(/\[blank\]/g, ""))) qRow(q, [hear(function () { sayText(it.q); })]); else body.appendChild(q);
      }
      var opts = el("div", "opts"); opts.id = "opts";
      if (it.type === "say") {
        if (!done) {
          var sb = btn("btn main", "I said it ✓", said); sb.id = "said"; opts.appendChild(sb);
          var ag = btn("btn", "Again 🔁", function () { sayText(it.en); }); ag.id = "again"; opts.appendChild(ag);
        }
      } else if (it.type === "recall" && !S.shown) {
        opts.appendChild(el("div", "thai", UI("recall_hint")));
        var shb = btn("btn main", "Show choices 👀", showChoices); shb.id = "show"; opts.appendChild(shb);
      } else {
        for (var k = 0; k < it.options.length; k++) {
          (function (k) {
            var isRight = S.picked === k && k === it.answer;
            var isMissed = S.missed.indexOf(k) >= 0;
            var cls = isRight ? "btn right" : isMissed ? "btn miss" : "btn";
            var t = (isMissed ? "✗ " : "") + it.options[k] + (isRight ? "  ✓" : "");
            var ob = btn(cls, t, function () { pick(k); }); ob.setAttribute("data-k", String(k));
            opts.appendChild(ob);
          })(k);
        }
      }
      body.appendChild(opts);
      if (wrong) {
        var f = el("div", "feedback", it.th + "  ✓ " + it.options[it.answer]); f.id = "fb"; /* one line, like v1: Thai why-line + right answer */
        body.appendChild(f);
      }
      if (done) {
        var y = el("div", "yes", (it.type === "say" ? "Lovely! 🌸 " : "Yes! ✓ ") + (it.pic ? it.pic + " " : ""));
        y.appendChild(el("span", "nowrap", UI("great"))); y.id = "fb";
        body.appendChild(y);
        var nx = btn("btn main", S.i + 1 >= S.q.length ? "See my score 🎉" : "Next ➜", next); nx.id = "next";
        body.appendChild(nx);
      }
    }
    app.appendChild(body);
    document.getElementById("foot").style.display = S.screen === "start" ? "" : "none";
    if (scrollTop) { try { window.scrollTo(0, 0); } catch (e) {} }
  }

  /* ---------- self-test (check.py calls this in headless Chrome) ---------- */
  window.__test = function () {
    var errs = [];
    function ok(c, m) { if (!c) errs.push(m); }
    ok(DATA.length === ROUNDS * ROUND_SIZE, "200 items");
    ok(Q.levels.length * 2 === ROUNDS, "5 levels x 2 parts");
    for (var r = 0; r < ROUNDS; r++) { var lv = Q.levels[Math.floor(r / 2)].n; for (var k = 0; k < ROUND_SIZE; k++) ok(DATA[r * ROUND_SIZE + k].level === lv, "round " + (r + 1) + " item " + k + " level"); }
    DATA.forEach(function (it) { ok(!!it.th && it.th_status === "NEEDS NANCY" && !!it.en, it.id + " th/en"); if (it.type !== "say") ok(it.answer >= 0 && it.answer < it.options.length, it.id + " answer"); });
    ok(V.verses.length > 0 && V.phrases.length > 0 && /Crossway/.test(V.notice), "verse data");
    /* mock iOS 18 voice list (names can be localized; voiceURI is stable) */
    var ios = [
      { name: "Bouffon", lang: "en-US", voiceURI: "com.apple.speech.synthesis.voice.Hysterical" },
      { name: "Albert", lang: "en-US", voiceURI: "com.apple.speech.synthesis.voice.Albert" },
      { name: "Superstar", lang: "en-US", voiceURI: "com.apple.speech.synthesis.voice.Princess" },
      { name: "Wobble", lang: "en-US", voiceURI: "com.apple.speech.synthesis.voice.Bubbles" },
      { name: "Eddy (English (US))", lang: "en-US", voiceURI: "com.apple.eloquence.en-US.Eddy" },
      { name: "Fred", lang: "en-US", voiceURI: "com.apple.speech.synthesis.voice.Fred" },
      { name: "Moira", lang: "en-IE", voiceURI: "com.apple.voice.compact.en-IE.Moira" },
      { name: "Rishi", lang: "en-IN", voiceURI: "com.apple.voice.compact.en-IN.Rishi" },
      { name: "Karen", lang: "en-AU", voiceURI: "com.apple.voice.compact.en-AU.Karen" },
      { name: "Daniel", lang: "en-GB", voiceURI: "com.apple.voice.compact.en-GB.Daniel" },
      { name: "Aaron", lang: "en-US", voiceURI: "com.apple.ttsbundle.siri_Aaron_en-US_compact" },
      { name: "Samantha", lang: "en-US", voiceURI: "com.apple.voice.compact.en-US.Samantha" },
      { name: "Thai voice", lang: "th-TH", voiceURI: "com.apple.voice.compact.th-TH.Kanya" }];
    function names(l) { return l.map(function (v) { return v.name; }).join("|"); }
    window.__voiceProof = { main: names(pickVoices(ios, false)), mainTh: names(pickVoices(ios, true)), replay: names(replayVoices(ios, false)), replayTh: names(replayVoices(ios, true)) };
    ok(pickVoices(ios, false)[0].voiceURI === "com.apple.voice.compact.en-US.Samantha", "main voice = Samantha by voiceURI");
    ok(!/Bouffon|Albert|Superstar|Wobble|Eddy|Fred/.test(names(pickVoices(ios, false)) + names(replayVoices(ios, false))), "novelty voices never picked");
    ok(names(replayVoices(ios, true)).indexOf("Daniel|Karen|Samantha") === 0, "replay Daniel -> Karen -> Samantha");
    ok(!/Moira|Rishi/.test(names(pickVoices(ios, true)) + names(replayVoices(ios, true))), "no Moira/Rishi for th or v/w pairs");
    ok(pickVoices([{ name: "Jester", lang: "en-US", voiceURI: "com.apple.speech.synthesis.voice.Jester" }], false).length === 0, "novelty-only -> unset voice (lang en-US)");
    ok(CARRIER.split("{w}").join("seed") === "Say seed again.", "carrier");
    ok(RATE_WORD === 0.7 && RATE_PHRASE === 0.85 && RATE_SLOW === 0.6 && PITCH === 1, "rates");
    ok(document.querySelectorAll("script[src],link[rel=stylesheet],img,iframe,video,audio").length === 0, "no external resources");
    return errs.length ? "FAIL: " + errs.join("; ") : "PASS";
  };

  document.getElementById("draft").textContent = UI("draft_note");
  load();
  render(true);
})();
</script>
</body>
</html>
