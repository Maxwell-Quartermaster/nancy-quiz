<title>Nancy's English 2</title>
<style>
/* Instructor: Nancy's English 2. Local only. Palette (Maxwell t120u): green and pink, very small rose-pink highlights,
   very very small baby-blue highlights. Verse card: gold on green (t711u). Safari iOS 14.2: no flex gap, ES2017 only. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: #14532D; }
body {
  margin: 0; background: #14532D; color: #FFFFFF; font-size: 20px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", "Leelawadee UI", sans-serif;
  min-height: 100vh; box-sizing: border-box; -webkit-tap-highlight-color: transparent;
  padding: calc(18px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
}
#app { max-width: 640px; margin: 0 auto; }
.stack > * + * { margin-top: 14px; }
.opts > * + * { margin-top: 12px; }
.title { font-size: 28px; line-height: 1.3; font-weight: 700; }
.title .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #FB7185; vertical-align: middle; margin-left: 8px; }
.title .dot.blue { background: #BAE6FD; width: 5px; height: 5px; margin-left: 4px; }
.lead { font-size: 20px; line-height: 1.5; }
.small { font-size: 18px; line-height: 1.5; }
.thai { background: #0F3D22; color: #FFFFFF; border-left: 4px solid #F9A8D4; border-radius: 10px; padding: 10px 14px; font-size: 20px; line-height: 1.7; }
.cue { background: #0F3D22; border: 2px solid #F9A8D4; border-radius: 14px; padding: 16px; font-size: 26px; line-height: 1.6; text-align: center; }
.q { font-size: 24px; line-height: 38px; white-space: pre-line; overflow-wrap: break-word; word-wrap: break-word; }
.line { font-size: 28px; line-height: 1.45; font-weight: 700; }
.blank { display: inline-block; width: 2.2em; height: 1em; border-bottom: 3px solid #F9A8D4; margin: 0 0.15em; vertical-align: baseline; }
button { -webkit-appearance: none; appearance: none; touch-action: manipulation; font-family: inherit; cursor: pointer; margin: 0; -webkit-user-select: none; user-select: none; }
.btn { display: block; width: 100%; box-sizing: border-box; min-height: 56px; padding: 14px 16px; font-size: 20px; line-height: 1.4; border-radius: 14px;
  border: 2px solid #FFFFFF; background: #0F3D22; color: #FFFFFF; text-align: left; white-space: pre-line; overflow-wrap: break-word; word-wrap: break-word; }
.btn.main { text-align: center; background: #F9A8D4; color: #14532D; border-color: #F9A8D4; font-weight: 700; }
.btn.right { background: #FFFFFF; color: #14532D; border: 3px solid #FB7185; font-weight: 700; }
.btn.miss { border: 2px dashed #B4B8C5; color: #D1D5DB; text-decoration: line-through; }
.btn.glow { border: 3px solid #F9A8D4; box-shadow: 0 0 0 3px #FB7185; }
.btn.locked { color: #D1D5DB; border: 2px dashed #B4B8C5; }
.btn.hear { text-align: center; font-size: 24px; min-height: 72px; }
.row { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-align-items: stretch; align-items: stretch; }
.row > .btn { -webkit-flex: 1 1 auto; flex: 1 1 auto; width: auto; min-width: 0; }
.row > .spk { -webkit-flex: 0 0 60px; flex: 0 0 60px; margin-left: 8px; }
.spk { min-height: 56px; min-width: 56px; font-size: 22px; border-radius: 14px; border: 2px solid #F9A8D4; background: #0F3D22; color: #FFFFFF; padding: 0; }
.pill { min-height: 56px; min-width: 56px; padding: 10px 16px; font-size: 18px; line-height: 1.3; border-radius: 999px; border: 2px solid #FFFFFF; background: #0F3D22; color: #FFFFFF; }
.pill + .pill { margin-left: 8px; }
.bar { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; }
.bar > * { margin-bottom: 6px; }
.stats { font-size: 20px; line-height: 1.5; }
.stats span + span { margin-left: 14px; }
.pips { font-size: 0; line-height: 0; }
.pips span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin: 0 4px 4px 0; border: 2px solid #FFFFFF; box-sizing: border-box; }
.pips span.done { background: #F9A8D4; border-color: #F9A8D4; }
.pips span.now { border-color: #FB7185; }
.feedback { font-size: 20px; line-height: 1.7; }
.feedback > * + * { margin-top: 10px; }
.card { background: #0F3D22; border-radius: 14px; padding: 12px 14px; border: 2px solid #F9A8D4; }
.card .en { font-size: 22px; font-weight: 700; line-height: 1.4; }
.verse { background: #14532D; border: 3px solid #FACC15; border-radius: 18px; padding: 22px 18px; color: #FACC15; }
.verse .v { font-size: 26px; line-height: 1.5; font-weight: 700; white-space: pre-line; }
.verse .ref { font-size: 20px; margin-top: 8px; color: #FDE68A; }
.verse .ph { font-size: 22px; line-height: 1.5; margin-top: 18px; padding-top: 14px; border-top: 1px solid #FACC15; }
.verse .pth, .verse .gloss { font-size: 20px; line-height: 1.7; color: #FDE68A; }
.notice { font-size: 18px; line-height: 1.6; color: #FFFFFF; }
</style>
</head>

<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("quiz-data").textContent);
  var V = JSON.parse(document.getElementById("verse-data").textContent);
  var SHOW_THAI_BIBLE = false; /* THSV is OFF: it needs the Thailand Bible Society's written permission. */
  var KEY = "nancy-english-v2";
  var CFG = D.settings;
  var GAPS = CFG.review_gaps_days; /* Leitner boxes 1..5 -> 1, 3, 7, 14, 30 days */
  var BY = {}; D.items.forEach(function (it) { BY[it.id] = it; });
  var app = document.getElementById("app");
  try { if (navigator.storage && navigator.storage.persist) { var pp = navigator.storage.persist(); if (pp && pp.catch) pp.catch(function () {}); } } catch (e) {}

  /* ---------- days (local calendar day numbers) ---------- */
  function dayNum(d) { return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
  var NOW = null; /* test hook: fixed day number */
  function today() { return NOW != null ? NOW : dayNum(new Date()); }

  /* ---------- state ---------- */
  function fresh() { return { v: 3, seen: {}, boxes: {}, miss: {}, gems: 0, days: [], repairs: [], open: { "1": true }, done: {}, newOn: {} }; }
  function obj(x) { return x && typeof x === "object" && !Array.isArray(x) ? x : {}; }
  function arr(x) { return Array.isArray(x) ? x.filter(function (n) { return typeof n === "number"; }) : []; }
  function clean(s) {
    if (!s || typeof s !== "object" || s.v !== 3) return fresh();
    var f = fresh();
    f.seen = obj(s.seen); f.boxes = obj(s.boxes); f.miss = obj(s.miss); f.open = obj(s.open); f.open["1"] = true;
    f.done = obj(s.done); f.newOn = obj(s.newOn);
    f.gems = typeof s.gems === "number" && s.gems >= 0 ? s.gems : 0;
    f.days = arr(s.days); f.repairs = arr(s.repairs);
    Object.keys(f.boxes).forEach(function (k) { var b = f.boxes[k]; if (!BY[k] || !b || typeof b.b !== "number" || typeof b.due !== "number") delete f.boxes[k]; });
    Object.keys(f.seen).forEach(function (k) { if (!BY[k]) delete f.seen[k]; });
    return f;
  }
  function load() { try { var raw = window.localStorage.getItem(KEY); return raw ? clean(JSON.parse(raw)) : fresh(); } catch (e) { return fresh(); } }
  var S = load();
  function save() { try { window.localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  /* ---------- helpers ---------- */
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function btn(cls, text, fn) { var b = el("button", cls, text); b.type = "button"; b.addEventListener("click", fn); return b; }
  function clear() { while (app.firstChild) app.removeChild(app.firstChild); try { window.scrollTo(0, 0); } catch (e) {} }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function levelItems(n) { return D.items.filter(function (it) { return it.level === n; }); }
  /* interleave: round-robin across topics, keeping data order inside a topic (errands stay arrive -> ask -> pay -> leave) */
  function interleave(items) {
    var groups = {}, order = [];
    items.forEach(function (it) { if (!groups[it.topic]) { groups[it.topic] = []; order.push(it.topic); } groups[it.topic].push(it); });
    var out = [], more = true;
    while (more) { more = false; order.forEach(function (t) { var g = groups[t]; if (g.length) { out.push(g.shift()); more = true; } }); }
    return out;
  }
  var LORDER = {}; D.levels.forEach(function (L) { LORDER[L.n] = interleave(levelItems(L.n)).map(function (it) { return it.id; }); });
  function spokenText(s) { return s.replace(/\[blank\]/g, " … ").replace(/[^\x20-\x7E\u2019\u2026]/g, " ").replace(/\s+/g, " ").trim(); }

  /* ---------- speech (no microphone, nothing recorded) ---------- */
  var VOICES = [], vIdx = 0;
  function loadVoices() { try { VOICES = (window.speechSynthesis.getVoices() || []).filter(function (v) { return /^en([-_]|$)/i.test(v.lang); }); } catch (e) { VOICES = []; } }
  try { if (window.speechSynthesis) { loadVoices(); if (window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener("voiceschanged", loadVoices); else window.speechSynthesis.onvoiceschanged = loadVoices; } } catch (e) {}
  function canSpeak() { return !!(window.speechSynthesis && window.SpeechSynthesisUtterance); }
  function speak(text) {
    try {
      if (!canSpeak()) return false;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(spokenText(text)); u.lang = "en-US"; u.rate = CFG.voice_rate;
      if (!VOICES.length) loadVoices();
      if (VOICES.length) { u.voice = VOICES[vIdx % VOICES.length]; u.lang = u.voice.lang; vIdx++; } /* rotate voices: high-variability listening */
      window.speechSynthesis.speak(u); return true;
    } catch (e) { return false; }
  }
  function spk(text, label) { var b = btn("spk", "🔊", function () { speak(text); }); b.setAttribute("aria-label", label || ("Hear: " + text)); return b; }

  /* ---------- streak (forgiving: one missed day can be repaired once per week) ---------- */
  function has(list, d) { return list.indexOf(d) >= 0; }
  function practiced(s, d) { return has(s.days, d) || has(s.repairs, d); }
  function markDay(s, t) {
    var repaired = false;
    if (!has(s.days, t)) {
      if (!practiced(s, t - 1) && practiced(s, t - 2) && !s.repairs.some(function (r) { return r > t - 8; })) { s.repairs.push(t - 1); repaired = true; }
      s.days.push(t);
      if (s.days.length > 400) s.days = s.days.slice(-400);
    }
    return repaired;
  }
  function streak(s, t) { var d = practiced(s, t) ? t : t - 1, n = 0; while (practiced(s, d)) { n++; d--; } return n; }

  /* ---------- Leitner review ---------- */
  function setBox(s, id, b, t) { b = Math.max(1, Math.min(5, b)); s.boxes[id] = { b: b, due: t + GAPS[b - 1] }; }
  function grade(s, id, firstTry, t) {
    var bx = s.boxes[id];
    if (!firstTry) { setBox(s, id, 1, t); s.miss[id] = (s.miss[id] || 0) + 1; return; }
    if (!bx) { setBox(s, id, 2, t); return; }          /* new and right on the first try -> 3 days */
    if (bx.due <= t) setBox(s, id, bx.b + 1, t);       /* due and right -> next box */
  }
  function dueIds(s, t) {
    var ids = Object.keys(s.boxes).filter(function (k) { return s.boxes[k].due <= t && BY[k]; });
    ids.sort(function (a, b) { return s.boxes[a].due - s.boxes[b].due || s.boxes[a].b - s.boxes[b].b; });
    /* interleave across levels and topics */
    var g = {}, keys = [];
    ids.forEach(function (k) { var it = BY[k], key = it.topic; if (!g[key]) { g[key] = []; keys.push(key); } g[key].push(k); });
    var out = [], more = true;
    while (more) { more = false; keys.forEach(function (key) { if (g[key].length) { out.push(g[key].shift()); more = true; } }); }
    return out;
  }
  function firstTryCount(s, n) { return levelItems(n).filter(function (it) { return s.seen[it.id] && s.seen[it.id].ft; }).length; }
  function seenCount(s, n) { return levelItems(n).filter(function (it) { return s.seen[it.id]; }).length; }
  function needFor(n) { return Math.ceil(levelItems(n).length * CFG.unlock_first_try); }
  function isOpen(s, n) { return n === 1 || !!s.open[String(n)]; }
  function unseenOpen(s) {
    var out = [];
    D.levels.forEach(function (L) { if (isOpen(s, L.n)) LORDER[L.n].forEach(function (id) { if (!s.seen[id]) out.push(id); }); });
    return out;
  }
  /* Today: due reviews first, then up to 3 new items, then light practice of seen items. */
  function buildToday(s, t) {
    var size = CFG.session_size, due = dueIds(s, t);
    var newLeft = Math.max(0, CFG.new_per_day - (s.newOn[String(t)] || 0));
    if (due.length > 20) newLeft = 0;
    var fresh_ = unseenOpen(s).slice(0, newLeft);
    var ids = due.slice(0, size - fresh_.length).concat(fresh_);
    if (ids.length < size) {
      var extra = Object.keys(s.seen).filter(function (k) { return ids.indexOf(k) < 0 && isOpen(s, BY[k].level); });
      extra.sort(function (a, b) { return ((s.miss[b] || 0) - (s.miss[a] || 0)) || (a < b ? -1 : 1); });
      ids = ids.concat(extra.slice(0, size - ids.length));
    }
    return ids;
  }
  function buildLevel(s, n) {
    var un = LORDER[n].filter(function (id) { return !s.seen[id]; });
    if (un.length) return un.slice(0, CFG.session_size);
    var redo = LORDER[n].filter(function (id) { return !s.seen[id].ft; }).concat(shuffle(LORDER[n].filter(function (id) { return s.seen[id].ft; })));
    return redo.slice(0, CFG.session_size);
  }
  /* level events after a run: finished all items, and the 80% first-try unlock */
  function levelEvents(s) {
    var ev = [];
    D.levels.forEach(function (L) {
      var n = L.n, k = String(n);
      if (!s.done[k] && seenCount(s, n) === levelItems(n).length) { s.done[k] = true; ev.push({ kind: "done", n: n }); }
      var nx = D.levels[n] ? n + 1 : 0;
      if (nx && !s.open[String(nx)] && firstTryCount(s, n) >= needFor(n)) { s.open[String(nx)] = true; ev.push({ kind: "open", n: nx, from: n }); }
    });
    return ev;
  }

  /* ---------- runs ---------- */
  var R = null;
  function startRun(kind, ids, title) {
    if (!ids.length) { home(); return; }
    R = { kind: kind, title: title, queue: ids.slice(), pos: 0, done: {}, back: {}, gems: 0, firstTry: 0, cards: 0, misses: 0, again: false };
    showItem();
  }
  function startToday() { startRun("today", buildToday(S, today()), "Today ☀️"); }
  function startReview() { startRun("review", dueIds(S, today()).slice(0, CFG.session_size), "Review 🔁"); }
  function startLevel(n) { startRun("level" + n, buildLevel(S, n), "Level " + n); }

  function topBar(box) {
    var bar = el("div", "bar");
    bar.appendChild(btn("pill", "⌂ Home", home));
    bar.appendChild(el("div", "stats", R.title + "   💎 " + (S.gems)));
    box.appendChild(bar);
    var pips = el("div", "pips");
    for (var i = 0; i < R.queue.length; i++) pips.appendChild(el("span", i < R.pos ? "done" : (i === R.pos ? "now" : "")));
    box.appendChild(pips);
  }
  function UI(k, vars) { var t = (D.ui[k] && D.ui[k].th) || ""; if (vars) Object.keys(vars).forEach(function (v) { t = t.split("{" + v + "}").join(String(vars[v])); }); return t; }
  function thaiHelp(box, it) {
    var holder = el("div", "");
    var b = btn("pill", UI("thai_button"), function () { if (!holder.firstChild) holder.appendChild(el("div", "thai", it.th)); });
    var wrap = el("div", ""); wrap.appendChild(b); box.appendChild(wrap); box.appendChild(holder);
  }
  function qBlock(it) {
    var row = el("div", "row");
    var q = el("div", "q"); q.style.webkitFlex = "1 1 auto"; q.style.flex = "1 1 auto";
    var parts = it.q.split("[blank]");
    parts.forEach(function (t, i) { q.appendChild(document.createTextNode(t)); if (i < parts.length - 1) q.appendChild(el("span", "blank")); });
    row.appendChild(q);
    if (/[A-Za-z]{2}/.test(spokenText(it.q)) && it.type === "choice") row.appendChild(spk(it.q, "Hear the question"));
    return row;
  }

  function showItem() {
    clear();
    var it = BY[R.queue[R.pos]];
    R.misses = 0; R.again = false;
    var box = el("div", "stack"); box.setAttribute("data-id", it.id); box.setAttribute("data-type", it.type); box.id = "card";
    topBar(box);
    if (it.type === "say") { sayItem(box, it); app.appendChild(box); return; }
    var fb = el("div", "feedback", ""); fb.id = "fb";
    var opts = el("div", "opts"); opts.id = "opts";
    if (it.type === "listen") {
      box.appendChild(el("div", "q", it.q));
      var note = el("div", "small", "");
      box.appendChild(btn("btn hear", "🔊 Hear it", function () { if (!speak(it.say)) note.textContent = "No voice on this phone. Tap ‘For Maxwell’ and ask him to say it."; }));
      box.appendChild(note);
      var mx = btn("pill", "For Maxwell 👀", function () { mx.textContent = "Maxwell, please say: " + it.say; });
      var w = el("div", ""); w.appendChild(mx); box.appendChild(w);
      if (!canSpeak()) note.textContent = "No voice on this phone. Tap ‘For Maxwell’ and ask him to say it.";
      setTimeout(function () { speak(it.say); }, 350);
      makeOptions(it, opts, fb, false);
      box.appendChild(opts);
    } else if (it.type === "recall") {
      if (it.cue_th) box.appendChild(el("div", "cue", it.cue_th));
      if (it.cue_audio) {
        box.appendChild(btn("btn hear", "🔊 Hear it", function () { speak(it.cue_audio); }));
        var mx2 = btn("pill", "For Maxwell 👀", function () { mx2.textContent = "Maxwell, please say: " + it.cue_audio; });
        var w2 = el("div", ""); w2.appendChild(mx2); box.appendChild(w2);
        setTimeout(function () { speak(it.cue_audio); }, 350);
      }
      box.appendChild(el("div", "q", it.q));
      box.appendChild(el("div", "thai", UI("recall_hint")));
      var show = btn("btn main", "Show choices 👀", function () {
        show.parentNode.removeChild(show);
        makeOptions(it, opts, fb, true);
      });
      show.id = "show";
      box.appendChild(show);
      box.appendChild(opts);
    } else {
      box.appendChild(qBlock(it));
      makeOptions(it, opts, fb, true);
      box.appendChild(opts);
    }
    thaiHelp(box, it);
    box.appendChild(fb);
    app.appendChild(box);
  }

  function makeOptions(it, opts, fb, withSpk) {
    var order = shuffle(it.options.map(function (o, i) { return i; }));
    var bs = [], spks = [];
    order.forEach(function (k) {
      var row = el("div", "row");
      var b = btn("btn", it.options[k], function () { pick(k, b, bs, spks, fb, it); });
      b.setAttribute("data-k", String(k)); bs.push(b); row.appendChild(b);
      var s = spk(it.options[k]); if (!withSpk) s.style.display = "none"; spks.push(s); row.appendChild(s);
      opts.appendChild(row);
    });
  }

  function pick(k, b, bs, spks, fb, it) {
    if (b.disabled) return;
    if (k === it.answer) {
      bs.forEach(function (x) { x.disabled = true; });
      spks.forEach(function (s) { s.style.display = ""; });
      b.className = "btn right";
      resolve(it, R.misses === 0, fb);
      return;
    }
    R.misses++;
    b.className = "btn miss"; b.disabled = true;
    while (fb.firstChild) fb.removeChild(fb.firstChild);
    fb.appendChild(el("div", "", "Almost. Try again. 💚"));
    fb.appendChild(el("div", "thai", it.th));
    if (R.misses >= 2 || bs.filter(function (x) { return !x.disabled; }).length === 1) {
      bs.forEach(function (x) { if (x.getAttribute("data-k") === String(it.answer)) x.className = "btn glow"; });
    }
    if (!R.back[it.id]) { R.back[it.id] = true; R.queue.splice(Math.min(R.pos + 1 + CFG.return_after, R.queue.length), 0, it.id); }
  }

  function sayItem(box, it) {
    box.appendChild(el("div", "q", it.q));
    var row = el("div", "row"); var ln = el("div", "line", it.en); ln.style.webkitFlex = "1 1 auto"; ln.style.flex = "1 1 auto";
    row.appendChild(ln); row.appendChild(spk(it.en)); box.appendChild(row);
    box.appendChild(el("div", "thai", it.th));
    box.appendChild(el("div", "small", "💡 " + it.tip));
    box.appendChild(el("div", "small", "1. Read it.  2. Tap 🔊 and listen.  3. Say it with the voice."));
    box.appendChild(el("div", "small", "No microphone. Nothing is recorded. 🌸"));
    var fb = el("div", "feedback", ""); fb.id = "fb";
    var acts = el("div", "opts"); acts.id = "opts";
    var ok = btn("btn main", "I said it ✓", function () { acts.parentNode.removeChild(acts); resolve(it, !R.again, fb); });
    ok.id = "said";
    var ag = btn("btn", "Again 🔁", function () { R.again = true; speak(it.en); });
    ag.id = "again";
    acts.appendChild(ok); acts.appendChild(ag);
    box.appendChild(acts); box.appendChild(fb);
    setTimeout(function () { speak(it.en); }, 350);
  }

  function resolve(it, first, fb) {
    var t = today();
    var firstInRun = !R.done[it.id];
    if (firstInRun) {
      R.done[it.id] = true; R.cards++;
      var wasNew = !S.seen[it.id];
      if (wasNew) S.newOn[String(t)] = (S.newOn[String(t)] || 0) + 1;
      S.seen[it.id] = { ft: (S.seen[it.id] && S.seen[it.id].ft) || first ? 1 : 0 };
      grade(S, it.id, first, t);
      if (first) R.firstTry++;
    }
    var g = 1 + (first || it.type === "say" ? 1 : 0); /* gems for effort: 1 per card, +1 first try (speaking always counts) */
    S.gems += g; R.gems += g;
    if (markDay(S, t)) R.repaired = true;
    save();
    while (fb.firstChild) fb.removeChild(fb.firstChild);
    var warm = it.type === "say" ? "Lovely! 🌸 " : (first ? "Yes! 🌸 " : "Good! 🌸 ");
    fb.appendChild(el("div", "", warm + it.tip + "   +" + g + " 💎"));
    var c = el("div", "row"); var en = el("div", "card"); en.style.webkitFlex = "1 1 auto"; en.style.flex = "1 1 auto";
    en.appendChild(el("div", "en", (it.pic ? it.pic + "  " : "") + it.en)); c.appendChild(en); c.appendChild(spk(it.en)); fb.appendChild(c);
    if (it.type !== "say") fb.appendChild(el("div", "small", "Now say it one time. 🗣️"));
    var nx = btn("btn main", R.pos + 1 < R.queue.length ? "Next ➜" : "Finish ➜", next); nx.id = "next";
    fb.appendChild(nx);
    if (it.type !== "say") speak(it.en);
  }

  function next() {
    R.pos++;
    if (R.pos < R.queue.length) { showItem(); return; }
    var ev = levelEvents(S); save();
    endScreen(ev);
  }

  function endScreen(ev) {
    clear();
    var box = el("div", "stack"); box.id = "end";
    var done = ev.filter(function (e) { return e.kind === "done"; });
    var opened = ev.filter(function (e) { return e.kind === "open"; });
    if (done.length) {
      var n = done[0].n;
      box.appendChild(el("div", "title", "Level " + n + " complete! 🎉"));
      box.appendChild(el("div", "lead", firstTryCount(S, n) + " of " + levelItems(n).length + " right on the first try."));
      if (!opened.length && D.levels[n] && !isOpen(S, n + 1)) {
        box.appendChild(el("div", "lead", "Play Level " + n + " again any time. With " + needFor(n) + " first-try cards, Level " + (n + 1) + " opens. 🌱"));
        box.appendChild(el("div", "thai", UI("replay_hint", { n: n, need: needFor(n) })));
      }
    } else {
      box.appendChild(el("div", "title", "Well done! 🌷"));
      box.appendChild(el("div", "lead", R.cards + " cards today. " + R.firstTry + " on the first try."));
    }
    opened.forEach(function (e) {
      box.appendChild(el("div", "card", "🌷 Level " + e.n + " is open: " + D.levels[e.n - 1].title));
      box.appendChild(el("div", "thai", UI("level_open", { n: e.n })));
    });
    box.appendChild(el("div", "lead", "+" + R.gems + " 💎 for your effort."));
    if (R.repaired) box.appendChild(el("div", "small", "We kept your English days safe. 🌸"));
    box.appendChild(el("div", "thai", UI("end_hint")));
    box.appendChild(btn("btn main", "Today's verse ✨", verse));
    box.appendChild(btn("btn", "⌂ Home", home));
    app.appendChild(box);
  }

  function home() {
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
    clear();
    var t = today();
    var box = el("div", "stack"); box.id = "home";
    var ti = el("div", "title", "Nancy's English 2"); ti.appendChild(el("span", "dot")); ti.appendChild(el("span", "dot blue"));
    box.appendChild(ti);
    var st = streak(S, t);
    var stats = el("div", "stats"); stats.appendChild(el("span", "", "💎 " + S.gems)); stats.appendChild(el("span", "", "🌱 " + (st ? st + (st === 1 ? " day" : " days") : "Start today")));
    box.appendChild(stats);
    box.appendChild(el("div", "lead", "A little every day. About 10 cards. 🌸"));
    box.appendChild(el("div", "thai", UI("home_hint")));
    box.appendChild(btn("btn main", "Today ☀️", startToday));
    var due = dueIds(S, t).length;
    var rv = btn("btn", "Review (" + due + ") 🔁" + (due ? "" : "\nNothing to review now. 🌸"), function () { if (due) startReview(); });
    box.appendChild(rv);
    box.appendChild(btn("btn", "Levels 🗺️", levels));
    box.appendChild(btn("btn", "My hard words 📝", hard));
    box.appendChild(btn("btn", "Today's verse ✨", verse));
    app.appendChild(box);
  }

  function levels() {
    clear();
    var box = el("div", "stack"); box.id = "levels";
    box.appendChild(btn("pill", "⌂ Home", home));
    box.appendChild(el("div", "title", "Levels 🗺️"));
    box.appendChild(el("div", "thai", UI("levels_hint")));
    var msg = el("div", "small", "");
    var opts = el("div", "opts");
    D.levels.forEach(function (L) {
      var open = isOpen(S, L.n), sc = seenCount(S, L.n), ft = firstTryCount(S, L.n), tot = levelItems(L.n).length;
      var label = L.n + ". " + L.title + "\n" + L.th + "\n";
      if (open) label += (sc === tot ? "✓ Done · " : sc + " of " + tot + " cards · ") + ft + " first try";
      else label += "🔒 Opens at " + needFor(L.n - 1) + " first-try in Level " + (L.n - 1);
      opts.appendChild(btn(open ? "btn" : "btn locked", label, function () {
        if (open) startLevel(L.n);
        else msg.textContent = "Level " + L.n + " opens soon. Keep playing Level " + (L.n - 1) + ". 🌱";
      }));
    });
    box.appendChild(opts); box.appendChild(msg);
    app.appendChild(box);
  }

  function hardIds(s) {
    return Object.keys(s.miss).filter(function (k) { return BY[k] && s.miss[k] > 0 && s.boxes[k] && s.boxes[k].b <= 2; })
      .sort(function (a, b) { return s.miss[b] - s.miss[a]; });
  }
  function hard() {
    clear();
    var box = el("div", "stack"); box.id = "hard";
    box.appendChild(btn("pill", "⌂ Home", home));
    box.appendChild(el("div", "title", "My hard words 📝"));
    var ids = hardIds(S);
    if (!ids.length) box.appendChild(el("div", "lead", "No hard words right now. 🌸"));
    ids.slice(0, 20).forEach(function (id) {
      var it = BY[id], row = el("div", "row"), c = el("div", "card"); c.style.webkitFlex = "1 1 auto"; c.style.flex = "1 1 auto";
      c.appendChild(el("div", "en", it.en)); c.appendChild(el("div", "small", it.th));
      row.appendChild(c); row.appendChild(spk(it.en)); box.appendChild(row);
    });
    box.appendChild(el("div", "small", "Take a screenshot and show Maxwell or your teacher. 📸"));
    app.appendChild(box);
  }

  function verse() {
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
    clear();
    var n = today();
    var v = V.verses[((n % V.verses.length) + V.verses.length) % V.verses.length];
    var p = V.phrases[((n % V.phrases.length) + V.phrases.length) % V.phrases.length];
    var box = el("div", "stack"); box.id = "verse";
    box.appendChild(btn("pill", "⌂ Home", home));
    var c = el("div", "verse");
    var vr = el("div", "row"); var vt = el("div", "v", v.en); vt.style.webkitFlex = "1 1 auto"; vt.style.flex = "1 1 auto";
    vr.appendChild(vt); vr.appendChild(spk(v.en, "Hear the verse")); c.appendChild(vr);
    c.appendChild(el("div", "ref", v.ref + " (ESV)"));
    if (v.enGloss) c.appendChild(el("div", "gloss", v.enGloss));
    if (SHOW_THAI_BIBLE && v.th) c.appendChild(el("div", "gloss", v.th));
    var pr = el("div", "row"); var ph = el("div", "ph", "Phrase of the day: " + p.en); ph.style.webkitFlex = "1 1 auto"; ph.style.flex = "1 1 auto";
    pr.appendChild(ph); var sb = spk(p.en); sb.style.marginTop = "18px"; pr.appendChild(sb); c.appendChild(pr);
    c.appendChild(el("div", "pth", p.th));
    if (p.tip) c.appendChild(el("div", "pth", p.tip));
    box.appendChild(c);
    box.appendChild(el("div", "notice", V.notice));
    app.appendChild(box);
  }

  /* ---------- self-test (called by check.py through headless Chrome) ---------- */
  window.__test = function () {
    var errs = [];
    function ok(c, m) { if (!c) errs.push(m); }
    ok(D.levels.length === 5, "5 levels");
    D.levels.forEach(function (L) { ok(levelItems(L.n).length >= 36, "level " + L.n + " size"); });
    ok(D.items.length >= 180, "item count");
    D.items.forEach(function (it) {
      ok(!!it.th && it.th_status === "NEEDS NANCY" && !!it.en, it.id + " th/en");
      if (it.type !== "say") ok(it.answer >= 0 && it.answer < it.options.length, it.id + " answer");
      if (it.type === "listen") ok(!!it.say, it.id + " say");
      if (it.type === "recall") ok(!!(it.cue_th || it.cue_audio), it.id + " cue");
    });
    ok(V.verses.length > 0 && V.phrases.length > 0 && /Crossway/.test(V.notice), "verse data");
    V.phrases.forEach(function (p, i) { ok(!!p.en && !!p.th && p.th_status === "NEEDS NANCY", "phrase " + i + " flag"); });
    D.levels.forEach(function (L) { ok(L.th_status === "NEEDS NANCY", "level " + L.n + " th flag"); });
    ["home_hint", "thai_button", "recall_hint", "levels_hint", "end_hint", "level_open", "replay_hint"].forEach(function (k) { ok(!!D.ui[k] && D.ui[k].th_status === "NEEDS NANCY" && !!UI(k), "ui " + k); });
    ok(UI("level_open", { n: 2 }).indexOf("{n}") < 0 && UI("level_open", { n: 2 }).indexOf("2") >= 0, "ui fill-in");
    ok(GAPS.join(",") === "1,3,7,14,30", "gaps");
    var s = fresh(), t = 1000;
    grade(s, "L1-01", true, t); ok(s.boxes["L1-01"].b === 2 && s.boxes["L1-01"].due === t + 3, "new right -> box 2, 3 days");
    grade(s, "L1-02", false, t); ok(s.boxes["L1-02"].b === 1 && s.boxes["L1-02"].due === t + 1, "miss -> box 1, 1 day");
    grade(s, "L1-01", true, t + 1); ok(s.boxes["L1-01"].b === 2, "not due: no change");
    grade(s, "L1-01", true, t + 3); ok(s.boxes["L1-01"].b === 3 && s.boxes["L1-01"].due === t + 10, "due right -> box 3, 7 days");
    grade(s, "L1-01", false, t + 10); ok(s.boxes["L1-01"].b === 1, "miss -> back to box 1");
    ok(dueIds(s, t + 1).length === 1 && dueIds(s, t).length === 0, "due list");
    var s2 = fresh(); markDay(s2, 10); markDay(s2, 11); ok(streak(s2, 11) === 2, "streak 2");
    ok(markDay(s2, 13) === true && streak(s2, 13) === 4, "repair one missed day");
    markDay(s2, 15); ok(streak(s2, 15) === 1, "only one repair per week");
    var s3 = fresh(); var tid = buildToday(s3, t); ok(tid.length === 3, "day 1 Today = 3 new");
    tid.forEach(function (id) { s3.seen[id] = { ft: 1 }; s3.newOn[String(t)] = (s3.newOn[String(t)] || 0) + 1; grade(s3, id, true, t); });
    ok(buildToday(s3, t).filter(function (id) { return !s3.seen[id]; }).length === 0, "no more new the same day");
    var s4 = fresh(); levelItems(1).forEach(function (it, i) { s4.seen[it.id] = { ft: i < 31 ? 1 : 0 }; });
    var e4 = levelEvents(s4); ok(!s4.open["2"] && e4.length === 1 && e4[0].kind === "done", "31/40 keeps Level 2 closed");
    s4.seen[levelItems(1)[31].id].ft = 1; levelEvents(s4); ok(s4.open["2"] === true, "32/40 opens Level 2");
    ok(document.querySelectorAll("script[src],link[rel=stylesheet],img,iframe,video,audio").length === 0, "no external resources");
    return errs.length ? "FAIL: " + errs.join("; ") : "PASS";
  };
  window.__setDay = function (n) { NOW = n; }; /* screenshots only */
  window.__dayNum = function () { return dayNum(new Date()); };
  home();
})();
